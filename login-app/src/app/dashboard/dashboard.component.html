<div class="dashboard-container">
  <div class="header">
    <h1>Dashboard</h1>
    <div class="user-info">
      <span>Welcome, {{ currentUser }}!</span>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>

  <div class="content">
    <div class="controls">
      <button class="add-btn" (click)="openAddForm()">+ Add User</button>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Search by name or email..."
        class="search-input"
      />
    </div>

    <div class="form-modal" *ngIf="showAddForm">
      <div class="form-content">
        <h2>{{ editingId ? 'Edit User' : 'Add New User' }}</h2>
        <form (ngSubmit)="saveUser()">
          <div class="form-group">
            <label>Name</label>
            <input
              type="text"
              [(ngModel)]="formData.name"
              name="name"
              placeholder="Enter name"
            />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              [(ngModel)]="formData.email"
              name="email"
              placeholder="Enter email"
            />
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input
              type="text"
              [(ngModel)]="formData.phone"
              name="phone"
              placeholder="Enter phone"
            />
          </div>
          <div class="form-buttons">
            <button type="submit" class="save-btn">Save</button>
            <button type="button" class="cancel-btn" (click)="closeForm()">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <table class="users-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.phone }}</td>
          <td>
            <button class="edit-btn" (click)="openEditForm(user)">Edit</button>
            <button class="delete-btn" (click)="deleteUser(user.id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <p *ngIf="filteredUsers.length === 0" class="no-data">No users found</p>
  </div>
</div>
