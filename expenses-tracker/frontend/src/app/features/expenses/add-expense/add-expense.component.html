<div class="section-card" style="max-width: 520px; margin: 24px auto;">
  <h1 class="page-title">Add Expense</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="fill">
      <mat-label>Amount</mat-label>
      <input matInput formControlName="amount" type="number" min="0.01" step="0.01" />
      <mat-error *ngIf="form.controls.amount.errors?.required">Amount is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category">
        <mat-option *ngFor="let category of categories" [value]="category">{{ category }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.controls.category.errors?.required">Category is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date" />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="form.controls.date.errors?.required">Date is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Note</mat-label>
      <textarea matInput formControlName="note" rows="3"></textarea>
    </mat-form-field>

    <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="loading">Save Expense</button>
    <p class="error-message" *ngIf="error">{{ error }}</p>
  </form>
</div>
