<div class="section-card">
  <h1 class="page-title">Expenses</h1>
  <div class="flex-row" style="gap:12px; margin-bottom:16px;">
    <button mat-flat-button color="primary" (click)="router.navigate(['/expenses/add'])">Add Expense</button>
    <mat-form-field appearance="fill" style="flex:1; min-width:200px;">
      <mat-label>Search</mat-label>
      <input matInput [(ngModel)]="search" placeholder="Note or Category" />
    </mat-form-field>
    <mat-form-field appearance="fill" style="min-width:180px;">
      <mat-label>Category</mat-label>
      <mat-select [(value)]="category">
        <mat-option value="">All</mat-option>
        <mat-option value="Food">Food</mat-option>
        <mat-option value="Transport">Transport</mat-option>
        <mat-option value="Bills">Bills</mat-option>
        <mat-option value="Shopping">Shopping</mat-option>
        <mat-option value="Other">Other</mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-stroked-button color="primary" (click)="loadExpenses()">Filter</button>
  </div>
  <table mat-table [dataSource]="expenses" class="full-width mat-elevation-z1">
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let expense">{{ expense.date | date:'mediumDate' }}</td>
    </ng-container>
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let expense">{{ expense.category }}</td>
    </ng-container>
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Amount</th>
      <td mat-cell *matCellDef="let expense">₹ {{ expense.amount | number:'1.0-2' }}</td>
    </ng-container>
    <ng-container matColumnDef="note">
      <th mat-header-cell *matHeaderCellDef>Note</th>
      <td mat-cell *matCellDef="let expense">{{ expense.note }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let expense">
        <button mat-icon-button color="primary" (click)="router.navigate(['/expenses/edit', expense._id])">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="remove(expense._id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['date', 'category', 'amount', 'note', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['date', 'category', 'amount', 'note', 'actions'];"></tr>
  </table>
  <p *ngIf="!expenses.length && !loading" class="text-muted">No expenses found.</p>
  <app-loader [loading]="loading"></app-loader>
</div>
