<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <mat-icon class="logo-icon">account_circle</mat-icon>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline" class="auth-field">
        <mat-label>Email Address</mat-label>
        <input matInput formControlName="email" type="email" placeholder="Enter your email" />
        <mat-icon matPrefix>email</mat-icon>
        <mat-error *ngIf="form.controls.email.errors?.required">Email is required</mat-error>
        <mat-error *ngIf="form.controls.email.errors?.email">Enter a valid email address</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="auth-field">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" placeholder="Enter your password" />
        <mat-icon matPrefix>lock</mat-icon>
        <mat-error *ngIf="form.controls.password.errors?.required">Password is required</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" class="auth-button" type="submit" [disabled]="loading">
        <mat-icon *ngIf="loading" class="spin">refresh</mat-icon>
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing In...</span>
      </button>

      <div class="auth-links">
        <p class="auth-link-text">
          Don't have an account?
          <a routerLink="/auth/register" class="auth-link">Create one</a>
        </p>
      </div>

      <div class="error-container" *ngIf="error">
        <mat-icon class="error-icon">error</mat-icon>
        <span class="error-message">{{ error }}</span>
      </div>
    </form>
  </div>
</div>
