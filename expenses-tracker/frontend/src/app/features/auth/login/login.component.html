<div class="section-card" style="max-width: 420px; margin: 48px auto;">
  <h1 class="page-title">Login</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" />
      <mat-error *ngIf="form.controls.email.errors?.required">Email is required</mat-error>
      <mat-error *ngIf="form.controls.email.errors?.email">Enter a valid email</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" type="password" />
      <mat-error *ngIf="form.controls.password.errors?.required">Password is required</mat-error>
    </mat-form-field>

    <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="loading">Login</button>
    <p class="text-muted" style="margin-top: 16px;">
      Don't have an account? <a routerLink="/auth/register">Register</a>
    </p>
    <p class="error-message" *ngIf="error">{{ error }}</p>
  </form>
</div>
