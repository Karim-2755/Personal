<div class="section-card" style="max-width: 480px; margin: 48px auto;">
  <h1 class="page-title">Create Account</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="fill">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="form.controls.name.errors?.required">Name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" />
      <mat-error *ngIf="form.controls.email.errors?.required">Email is required</mat-error>
      <mat-error *ngIf="form.controls.email.errors?.email">Enter a valid email</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" type="password" />
      <mat-error *ngIf="form.controls.password.errors?.required">Password is required</mat-error>
      <mat-error *ngIf="form.controls.password.errors?.minlength">Password must be at least 6 characters</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Confirm Password</mat-label>
      <input matInput formControlName="confirmPassword" type="password" />
      <mat-error *ngIf="form.controls.confirmPassword.errors?.required">Confirm your password</mat-error>
    </mat-form-field>

    <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="loading">Register</button>
    <p class="text-muted" style="margin-top: 16px;">
      Already have an account? <a routerLink="/auth/login">Login</a>
    </p>
    <p class="error-message" *ngIf="error">{{ error }}</p>
  </form>
</div>
