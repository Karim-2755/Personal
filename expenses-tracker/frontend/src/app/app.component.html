<ng-container *ngIf="authService.isAuthenticated(); else guestLayout">

    <app-sidebar></app-sidebar>
    <div>
      <app-navbar></app-navbar>
      <main>
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</ng-container>
<ng-template #guestLayout>
  <main style="padding: 24px;">
    <router-outlet></router-outlet>
  </main>
</ng-template>
